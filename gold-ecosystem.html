<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اکوسیستم طلا و فین‌تک طلا در ایران | اطلس پُـل</title>
    <meta name="description" content="دایرکتوری تخصصی اکوسیستم طلا و فین‌تک طلای ایران: پلتفرم‌های خرید آنلاین طلا، صندوق‌های طلای بورس، شمش‌سازی، معادن و نهادهای مالی.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://polatlas.ir/gold-ecosystem">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: rgba(30, 41, 59, 0.7);
            --border-dark: rgba(255, 255, 255, 0.1);
            --gold-primary: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; transition: all 0.25s ease; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        /* Header Navigation */
        header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-dark); sticky: top; position: sticky; top: 0; z-index: 100; }
        .navbar { max-width: 1360px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        
        .brand-pol { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-size: 1.3rem; font-weight: 800; }
        .pol-logo-container {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
        }
        .pol-logo-svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .page-header { max-width: 1360px; margin: 2.5rem auto 1.5rem; padding: 0 2rem; }
        .header-title h1 { font-size: 2.2rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 14px; }
        .header-title p { color: var(--text-muted); font-size: 1rem; margin-top: 8px; }

        /* Controls */
        .controls-wrapper { max-width: 1360px; margin: 0 auto; padding: 0 2rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.2rem; }
        .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-dark); padding: 8px 18px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); cursor: pointer; }
        .tab-btn:hover, .tab-btn.active { background: var(--gold-primary); color: #000; border-color: var(--gold-primary); box-shadow: 0 0 15px var(--gold-glow); }

        .search-box-sm { position: relative; min-width: 280px; }
        .search-box-sm input { width: 100%; padding: 10px 16px 10px 42px; border: 1px solid var(--border-dark); border-radius: 30px; background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 0.9rem; outline: none; }
        .search-box-sm input:focus { border-color: var(--gold-primary); box-shadow: 0 0 15px var(--gold-glow); }
        .search-box-sm i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .container { max-width: 1360px; margin: 0 auto; padding: 0 2rem 5rem; }
        .biz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

        .biz-card {
            background: var(--card-dark); border: 1px solid var(--border-dark);
            border-radius: var(--radius-lg); padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between;
            position: relative; cursor: pointer; backdrop-filter: blur(12px);
        }
        .biz-card:hover { transform: translateY(-5px); border-color: var(--gold-primary); box-shadow: 0 10px 30px -10px var(--gold-glow); }

        .biz-header { display: flex; align-items: center; gap: 14px; margin-bottom: 1rem; }
        .biz-logo {
            width: 52px; height: 52px; border-radius: 12px;
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2);
            color: var(--gold-primary); font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
        }

        .biz-info h3 { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .biz-info .tag { display: inline-block; background: rgba(255, 255, 255, 0.08); color: var(--gold-primary); font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 8px; margin-top: 4px; }

        .biz-desc { color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 1.2rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .biz-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-dark); padding-top: 0.8rem; font-size: 0.82rem; color: var(--gold-primary); font-weight: 700; }

        /* Modal Profile */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1.5rem;
        }
        .modal-overlay.active { display: flex; }
        
        .profile-card {
            background: #1e293b; border: 1px solid var(--border-dark); width: 100%; max-width: 720px; border-radius: 24px;
            padding: 2.2rem; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); max-height: 90vh; overflow-y: auto;
        }
        .close-btn { position: absolute; top: 1.5rem; left: 1.5rem; background: rgba(255, 255, 255, 0.08); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; color: #fff; }
        .close-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .btn-visit { background: var(--gold-primary); color: #000; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
        .btn-visit:hover { background: #d97706; }

        footer { border-top: 1px solid var(--border-dark); padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; background: rgba(15, 23, 42, 0.95); }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="/" class="brand-pol">
                <div class="pol-logo-container">
                    <svg class="pol-logo-svg" viewBox="0 0 24 24">
                        <path d="M4 18V12C4 7.58172 7.58172 4 12 4C16.4183 4 20 7.58172 20 12V18"></path>
                        <path d="M4 14H20"></path>
                        <path d="M8 14V18"></path>
                        <path d="M12 14V18"></path>
                        <path d="M16 14V18"></path>
                    </svg>
                </div>
                <span>اطلس پُــل | اکوسیستم طلا</span>
            </a>
        </div>
    </header>

    <div class="page-header">
        <div class="header-title">
            <h1><i class="fa-solid fa-coins" style="color: var(--gold-primary);"></i> دایرکتوری و نقشه تخصصی اکوسیستم طلا</h1>
            <p>شناسایی پلتفرم‌های فین‌تک، صندوق‌های سرمایه‌گذاری، فروشگاه‌ها، تولیدکنندگان و نهادهای قانونی</p>
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">همه کسب‌وکارها</button>
            <button class="tab-btn" onclick="filterCategory('fintech', this)">فین‌تک طلا</button>
            <button class="tab-btn" onclick="filterCategory('stores', this)">فروشگاه آنلاین</button>
            <button class="tab-btn" onclick="filterCategory('funds', this)">بورس و صندوق‌ها</button>
            <button class="tab-btn" onclick="filterCategory('production', this)">تولید و پالایش</button>
        </div>

        <div class="search-box-sm">
            <input type="text" id="searchInput" placeholder="جستجوی کسب‌وکار...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </div>

    <main class="container">
        <div class="biz-grid" id="bizGrid"></div>
    </main>

    <footer>
        <p>© ۱۴۰۵ اطلس پُـل - جامع‌ترین مرجع تحلیل صنایع و اکوسیستم‌های پیشران ایران</p>
    </footer>

    <script>
        const items = [
            { id: 1, name: "زربان", category: "fintech", catName: "فین‌تک طلا", domain: "servatafza.ir", url: "https://servatafza.ir", desc: "پلتفرم مدیریت دارایی و سرمایه‌گذاری هوشمند در طلا با ارائه‌ راهکارهای فین‌تکی جهت پس‌انداز خرد." },
            { id: 2, name: "گلدیکا", category: "fintech", catName: "فین‌تک طلا", domain: "goldika.ir", url: "https://goldika.ir", desc: "سامانه آنلاین خرید و فروش طلای آب‌شده بدون اجرت با قابلیت تحویل فیزیکی و معامله ۲۴ ساعته." },
            { id: 3, name: "میلی گلد", category: "fintech", catName: "فین‌تک طلا", domain: "milli.gold", url: "https://milli.gold", desc: "پلتفرم شفاف خرید و فروش میلی‌گرمی طلای ۱۸ عیار، مناسب برای پس‌اندازهای خرد." },
            { id: 4, name: "صندوق عیار مفید", category: "funds", catName: "بورس و صندوق‌ها", domain: "emofid.com", url: "https://emofid.com", desc: "صندوق سرمایه‌گذاری با پشتوانه طلای فیزیکی معامله‌شده در بورس کالا." },
            { id: 5, name: "دیجی زرگر", category: "stores", catName: "فروشگاه آنلاین", domain: "digizargar.com", url: "https://digizargar.com", desc: "دایرکتوری و ویترین آنلاین ویترین‌داران و طلافروشان سراسر کشور." }
        ];

        function renderGrid(data) {
            const grid = document.getElementById('bizGrid');
            grid.innerHTML = data.map(item => `
                <div class="biz-card" onclick="window.open('${item.url}', '_blank')">
                    <div>
                        <div class="biz-header">
                            <div class="biz-logo"><i class="fa-solid fa-gem"></i></div>
                            <div class="biz-info">
                                <h3>${item.name}</h3>
                                <span class="tag">${item.catName}</span>
                            </div>
                        </div>
                        <p class="biz-desc">${item.desc}</p>
                    </div>
                    <div class="biz-footer">
                        <span>${item.domain}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') renderGrid(items);
            else renderGrid(items.filter(i => i.category === cat));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderGrid(items.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)));
        });

        renderGrid(items);
    </script>
</body>
</html>
